<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>body{background-color:white;}</style>

  <meta charset="UTF-8"/>
  <title>Income Distribution – Arizona</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
        body {
          font-family: sans-serif;
          text-align: center;
          margin: 2rem;
        }
        select {
          font-size: 1rem;
          padding: 0.4rem;
          margin-bottom: 1rem;
        }
        canvas {
          width: 100%;
          max-width: 700px;
          height: 400px;
        }
      </style>
</head>
<html>
  <body>
    <h2>Income Share by Quintile – Arizona</h2>
    <label>Select County, State:</label>
    <select id="countySelect"><option value='Statewide'>Statewide</option>
<option value='Apache, Arizona'>Apache, Arizona</option>
<option value='Cochise, Arizona'>Cochise, Arizona</option>
<option value='Coconino, Arizona'>Coconino, Arizona</option>
<option value='Gila, Arizona'>Gila, Arizona</option>
<option value='Graham, Arizona'>Graham, Arizona</option>
<option value='Greenlee, Arizona'>Greenlee, Arizona</option>
<option value='La Paz, Arizona'>La Paz, Arizona</option>
<option value='Maricopa, Arizona'>Maricopa, Arizona</option>
<option value='Mohave, Arizona'>Mohave, Arizona</option>
<option value='Navajo, Arizona'>Navajo, Arizona</option>
<option value='Pima, Arizona'>Pima, Arizona</option>
<option value='Pinal, Arizona'>Pinal, Arizona</option>
<option value='Santa Cruz, Arizona'>Santa Cruz, Arizona</option>
<option value='Yavapai, Arizona'>Yavapai, Arizona</option>
<option value='Yuma, Arizona'>Yuma, Arizona</option></select>
    <canvas id="barChart" width="700" height="400"></canvas>
    <script>  const incomeData = {"Statewide":[3.3,9.3,15.4,23.5,48.6],"Apache, Arizona":[1.2,7.1,14.1,24.4,53.1],"Cochise, Arizona":[3.2,9.2,15.3,24.5,47.8],"Coconino, Arizona":[2.8,8.6,14.6,23.2,50.8],"Gila, Arizona":[3.6,9.8,15.6,23.2,47.7],"Graham, Arizona":[3.1,9.9,16.6,24.8,45.6],"Greenlee, Arizona":[4.4,11.4,17.6,22.9,43.7],"La Paz, Arizona":[3.2,8.9,14.5,22.1,51.3],"Maricopa, Arizona":[3.6,9.3,14.9,22.6,49.6],"Mohave, Arizona":[3.5,9,14.8,22.6,50.1],"Navajo, Arizona":[2.6,9,15.7,24.6,48.1],"Pima, Arizona":[3.3,8.8,14.7,23.1,50],"Pinal, Arizona":[4.1,10.4,16.1,23.4,46],"Santa Cruz, Arizona":[3.6,9.3,15.1,24.2,47.8],"Yavapai, Arizona":[3.6,9.3,15.1,23,48.9],"Yuma, Arizona":[3.5,9.6,15.7,23.1,48.1]};
  const ctx = document.getElementById('barChart').getContext('2d');
  let chart;

  function renderChart(values) {
    if (chart) chart.destroy();

    chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Bottom 20%', 'Second 20%', 'Middle 20%', 'Fourth 20%', 'Top 20%'],
        datasets: [{
          label: 'Share (%)',
          data: values,
          backgroundColor: '#4576a7'
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => ctx.parsed.y + '%'
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            max: 100,
            title: {
              display: true,
              text: 'Income Share (%)'
            }
          },
          x: {
            title: {
              display: true,
              text: 'Quintile'
            }
          }
        }
      }
    });
  }

  document.getElementById('countySelect').addEventListener('change', function() {
    renderChart(Object.values(incomeData[this.value]));
  });

  renderChart(Object.values(incomeData['Statewide']));</script>
  </body>
</html>
</html>
