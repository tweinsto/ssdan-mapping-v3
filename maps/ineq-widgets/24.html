<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8"/>
  <title>Income Distribution – Maryland</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
        body {
          font-family: sans-serif;
          text-align: center;
          margin: 2rem;
        }
        select {
          font-size: 1rem;

          margin-bottom: 1rem;
        }
        canvas {
          width: 100%;
          max-width: 700px;
          height: 400px;
        }
      </style>
</head>
<html>
  <body>
    <h2>Income Share by Quintile – Maryland</h2>
    <label>Select County, State:</label>
    <select id="countySelect"><option value='Statewide'>Statewide</option>
<option value='Allegany, Maryland'>Allegany, Maryland</option>
<option value='Anne Arundel, Maryland'>Anne Arundel, Maryland</option>
<option value='Baltimore, Maryland'>Baltimore, Maryland</option>
<option value='Baltimore city, Maryland, Maryland'>Baltimore city, Maryland, Maryland</option>
<option value='Calvert, Maryland'>Calvert, Maryland</option>
<option value='Caroline, Maryland'>Caroline, Maryland</option>
<option value='Carroll, Maryland'>Carroll, Maryland</option>
<option value='Cecil, Maryland'>Cecil, Maryland</option>
<option value='Charles, Maryland'>Charles, Maryland</option>
<option value='Dorchester, Maryland'>Dorchester, Maryland</option>
<option value='Frederick, Maryland'>Frederick, Maryland</option>
<option value='Garrett, Maryland'>Garrett, Maryland</option>
<option value='Harford, Maryland'>Harford, Maryland</option>
<option value='Howard, Maryland'>Howard, Maryland</option>
<option value='Kent, Maryland'>Kent, Maryland</option>
<option value='Montgomery, Maryland'>Montgomery, Maryland</option>
<option value='Prince George's, Maryland'>Prince George's, Maryland</option>
<option value='Queen Anne's, Maryland'>Queen Anne's, Maryland</option>
<option value='Somerset, Maryland'>Somerset, Maryland</option>
<option value='St. Mary's, Maryland'>St. Mary's, Maryland</option>
<option value='Talbot, Maryland'>Talbot, Maryland</option>
<option value='Washington, Maryland'>Washington, Maryland</option>
<option value='Wicomico, Maryland'>Wicomico, Maryland</option>
<option value='Worcester, Maryland'>Worcester, Maryland</option></select>
    <canvas id="barChart" width="700" height="400"></canvas>
    <script>  const incomeData = {"Statewide":[3.6,9.6,15.7,23.6,47.5],"Allegany, Maryland":[3.2,9.3,15.7,24.7,47.2],"Anne Arundel, Maryland":[4.1,10.4,15.9,23.1,46.6],"Baltimore, Maryland":[3.4,9.2,15.1,23.1,49.3],"Baltimore city, Maryland, Maryland":[2.1,7.5,13.7,22.7,53.9],"Calvert, Maryland":[4.5,11.4,17.3,24,42.8],"Caroline, Maryland":[4,9.4,15.4,23.1,48.1],"Carroll, Maryland":[4.1,10.5,16.7,24.6,44.1],"Cecil, Maryland":[3.6,9.7,16.6,24,46],"Charles, Maryland":[4.3,11.4,17.3,24.3,42.8],"Dorchester, Maryland":[2.8,8.7,14.8,24.4,49.3],"Frederick, Maryland":[4.4,10.9,16.8,24.3,43.7],"Garrett, Maryland":[3.5,8.6,14.2,21.5,52.2],"Harford, Maryland":[3.8,10.4,16.9,24.5,44.3],"Howard, Maryland":[4,10.4,16.3,23.9,45.4],"Kent, Maryland":[4.1,8.9,14.8,24,48.2],"Montgomery, Maryland":[3.3,8.9,14.7,22.9,50.3],"Prince George's, Maryland":[3.8,10.5,16.5,24.2,45],"Queen Anne's, Maryland":[3.5,10.2,16.2,23.8,46.3],"Somerset, Maryland":[2.4,8.3,15.7,24.3,49.4],"St. Mary's, Maryland":[3.8,10.6,16.6,24.7,44.2],"Talbot, Maryland":[2.8,8.2,14,21.7,53.3],"Washington, Maryland":[3.5,9.3,15.6,24.1,47.6],"Wicomico, Maryland":[3.6,9.5,15.2,23.1,48.6],"Worcester, Maryland":[3.5,8.7,14.3,21.2,52.3]};
  const ctx = document.getElementById('barChart').getContext('2d');
  let chart;

  function renderChart(values) {
    if (chart) chart.destroy();

    chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Bottom 20%', 'Second 20%', 'Middle 20%', 'Fourth 20%', 'Top 20%'],
        datasets: [{
          label: 'Share (%)',
          data: values,
          backgroundColor: '#4576a7'
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => ctx.parsed.y + '%'
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            max: 100,
            title: {
              display: true,
              text: 'Income Share (%)'
            }
          },
          x: {
            title: {
              display: true,
              text: 'Quintile'
            }
          }
        }
      }
    });
  }

  document.getElementById('countySelect').addEventListener('change', function() {
    renderChart(Object.values(incomeData[this.value]));
  });

  renderChart(Object.values(incomeData['Statewide']));</script>
  </body>
</html>
</html>
