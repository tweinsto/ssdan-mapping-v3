    <script>  const incomeData = {"Statewide":[3.3,8.4,14.6,23.5,50.2],"Bernalillo, New Mexico":[2.9,8.6,14.8,23.4,50.3],"Catron, New Mexico":[4.4,8.9,15.4,24.7,46.6],"Chaves, New Mexico":[2.9,8,14.5,23.1,51.5],"Cibola, New Mexico":[3.1,8.3,15.4,25.5,47.8],"Colfax, New Mexico":[4.5,9.7,15.7,22.6,47.4],"Curry, New Mexico":[2.9,8.9,15.5,23.5,49.1],"De Baca, New Mexico":[3.7,8.4,15.4,29.2,43.3],"Doña Ana, New Mexico":[2.8,8.2,14.9,23.3,50.8],"Eddy, New Mexico":[2.8,8.9,16.3,25.6,46.4],"Grant, New Mexico":[3.4,8.4,13.6,24.6,50],"Guadalupe, New Mexico":[2.4,5.5,8.8,16.4,66.8],"Harding, New Mexico":[3.3,8.4,14.6,23.5,50.2],"Hidalgo, New Mexico":[3.8,9.3,15.8,24.6,46.4],"Lea, New Mexico":[2.6,8,14.9,23.5,51.1],"Lincoln, New Mexico":[3,7.8,13.9,23,52.3],"Los Alamos, New Mexico":[4.9,11.9,16.9,23.3,43],"Luna, New Mexico":[4.5,9.2,14.5,23.2,48.7],"McKinley, New Mexico":[2,7.1,14.8,24.7,51.4],"Mora, New Mexico":[3.4,7.4,14.2,19.9,55.1],"Otero, New Mexico":[3.9,9.8,15,24.2,47.1],"Quay, New Mexico":[2.3,8,15.4,25,49.2],"Rio Arriba, New Mexico":[3,8.1,14.4,24,50.5],"Roosevelt, New Mexico":[3.2,9.8,15.9,24,47.1],"San Juan, New Mexico":[3,8.6,14.5,23.1,50.8],"San Miguel, New Mexico":[2.9,7.8,14.6,25.5,49.2],"Sandoval, New Mexico":[4,10.3,15.9,23.5,46.3],"Santa Fe, New Mexico":[3.1,8.2,14.2,22.4,52.1],"Sierra, New Mexico":[3.6,8.5,14.9,25.7,47.2],"Socorro, New Mexico":[2.9,6.9,13.9,23.8,52.6],"Taos, New Mexico":[2.4,7.2,13.8,23.1,53.5],"Torrance, New Mexico":[4.3,9.4,15.6,24.3,46.4],"Union, New Mexico":[2.1,5.7,9.6,15.8,66.8],"Valencia, New Mexico":[3.3,9.2,15.2,23.7,48.6]};
  const ctx = document.getElementById('barChart').getContext('2d');
  let chart;

  function renderChart(values) {
    if (chart) chart.destroy();

    chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Bottom 20%', 'Second 20%', 'Middle 20%', 'Fourth 20%', 'Top 20%'],
        datasets: [{
          label: 'Share (%)',
          data: values,
          backgroundColor: '#4576a7'
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => ctx.parsed.y + '%'
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            max: 100,
            title: {
              display: true,
              text: 'Income Share (%)'
            }
          },
          x: {
            title: {
              display: true,
              text: 'Quintile'
            }
          }
        }
      }
    });
  }

  document.getElementById('countySelect').addEventListener('change', function() {
    renderChart(Object.values(incomeData[this.value]));
  });

  renderChart(Object.values(incomeData['Statewide']));</script>
