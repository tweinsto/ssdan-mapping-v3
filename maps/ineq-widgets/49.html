    <canvas id="barChart" width="700" height="400"></canvas>
    <script>  const incomeData = {"Statewide":[4.3,10.2,16,23.4,46.1],"Beaver, Utah":[4.9,12.3,18.3,25.5,39],"Box Elder, Utah":[4.2,11.3,16.7,23.8,44.1],"Cache, Utah":[4.5,9.9,15.5,22.3,47.8],"Carbon, Utah":[3.6,9.1,15.5,24.3,47.5],"Daggett, Utah":[4.4,10.4,15.7,24.6,44.8],"Davis, Utah":[4.9,11.2,16.7,23.2,44.1],"Duchesne, Utah":[4,9.8,16.3,23.8,46.2],"Emery, Utah":[4.6,10.9,17.2,24.7,42.7],"Garfield, Utah":[4,8.7,15.1,22.4,49.8],"Grand, Utah":[2.7,8.7,14.8,22.8,51],"Iron, Utah":[4.1,10,15.5,23.1,47.3],"Juab, Utah":[4.5,11.6,17.7,24.3,41.9],"Kane, Utah":[3.6,9.7,16,23,47.7],"Millard, Utah":[5.3,11.8,17.3,23.8,41.8],"Morgan, Utah":[6.1,12.1,16.6,21.8,43.3],"Piute, Utah":[3.5,7.1,15,25.2,49.1],"Rich, Utah":[4.8,11.2,17.6,23.9,42.5],"Salt Lake, Utah":[4.1,10.1,15.6,23,47.2],"San Juan, Utah":[3,9.4,15.3,23.1,49.3],"Sanpete, Utah":[4.6,10.2,15.9,23.7,45.6],"Sevier, Utah":[4.5,11.1,16.9,24.4,43.1],"Summit, Utah":[3.2,8.1,13.1,21.4,54.2],"Tooele, Utah":[5.1,11.5,16.8,22.6,44],"Uintah, Utah":[3.6,9.8,15.3,22.5,48.9],"Utah, Utah":[4.4,10.6,16,23,46],"Wasatch, Utah":[4.1,8.9,14.2,21.1,51.7],"Washington, Utah":[4.1,9.3,14.8,22.6,49.2],"Wayne, Utah":[5,10.3,17.2,24.8,42.7],"Weber, Utah":[4.6,10.9,16.5,23.6,44.5]};
  const ctx = document.getElementById('barChart').getContext('2d');
  let chart;

  function renderChart(values) {
    if (chart) chart.destroy();

    chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Bottom 20%', 'Second 20%', 'Middle 20%', 'Fourth 20%', 'Top 20%'],
        datasets: [{
          label: 'Share (%)',
          data: values,
          backgroundColor: '#4576a7'
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => ctx.parsed.y + '%'
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            max: 100,
            title: {
              display: true,
              text: 'Income Share (%)'
            }
          },
          x: {
            title: {
              display: true,
              text: 'Quintile'
            }
          }
        }
      }
    });
  }

  document.getElementById('countySelect').addEventListener('change', function() {
    renderChart(Object.values(incomeData[this.value]));
  });

  renderChart(Object.values(incomeData['Statewide']));</script>
  </body>
