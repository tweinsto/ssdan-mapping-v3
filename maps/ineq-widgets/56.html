<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>body{background-color:white;}</style>

  <meta charset="UTF-8"/>
  <title>Income Distribution – Wyoming</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
        body {
          font-family: sans-serif;
          text-align: center;
          margin: 2rem;
        }
        select {
          font-size: 1rem;
          padding: 0.4rem;
          margin-bottom: 1rem;
        }
        canvas {
          width: 100%;
          max-width: 700px;
          height: 400px;
        }
      </style>
</head>
<html>
  <body>
    <h2>Income Share by Quintile – Wyoming</h2>
    <label>Select County, State:</label>
    <select id="countySelect"><option value='Statewide'>Statewide</option>
<option value='Albany, Wyoming'>Albany, Wyoming</option>
<option value='Big Horn, Wyoming'>Big Horn, Wyoming</option>
<option value='Campbell, Wyoming'>Campbell, Wyoming</option>
<option value='Carbon, Wyoming'>Carbon, Wyoming</option>
<option value='Converse, Wyoming'>Converse, Wyoming</option>
<option value='Crook, Wyoming'>Crook, Wyoming</option>
<option value='Fremont, Wyoming'>Fremont, Wyoming</option>
<option value='Goshen, Wyoming'>Goshen, Wyoming</option>
<option value='Hot Springs, Wyoming'>Hot Springs, Wyoming</option>
<option value='Johnson, Wyoming'>Johnson, Wyoming</option>
<option value='Laramie, Wyoming'>Laramie, Wyoming</option>
<option value='Lincoln, Wyoming'>Lincoln, Wyoming</option>
<option value='Natrona, Wyoming'>Natrona, Wyoming</option>
<option value='Niobrara, Wyoming'>Niobrara, Wyoming</option>
<option value='Park, Wyoming'>Park, Wyoming</option>
<option value='Platte, Wyoming'>Platte, Wyoming</option>
<option value='Sheridan, Wyoming'>Sheridan, Wyoming</option>
<option value='Sublette, Wyoming'>Sublette, Wyoming</option>
<option value='Sweetwater, Wyoming'>Sweetwater, Wyoming</option>
<option value='Teton, Wyoming'>Teton, Wyoming</option>
<option value='Uinta, Wyoming'>Uinta, Wyoming</option>
<option value='Washakie, Wyoming'>Washakie, Wyoming</option>
<option value='Weston, Wyoming'>Weston, Wyoming</option></select>
    <canvas id="barChart" width="700" height="400"></canvas>
    <script>  const incomeData = {"Statewide":[3.7,9.6,15.8,23.7,47.3],"Albany, Wyoming":[2.7,8,14.3,24,51.1],"Big Horn, Wyoming":[4.2,10.1,16.1,23.3,46.4],"Campbell, Wyoming":[3.9,11,17.7,24.4,43],"Carbon, Wyoming":[4,10,16,23.9,46.2],"Converse, Wyoming":[4,9.8,17,24.5,44.6],"Crook, Wyoming":[4.8,11.3,16.9,25.6,41.5],"Fremont, Wyoming":[4.1,10.1,16,23.9,46],"Goshen, Wyoming":[3.5,8.8,15.4,23.3,49],"Hot Springs, Wyoming":[4.3,9.5,17.3,25.4,43.5],"Johnson, Wyoming":[2.8,9.4,15.4,23.7,48.7],"Laramie, Wyoming":[3.7,9.8,15.7,23.6,47.2],"Lincoln, Wyoming":[4.3,10.9,17,25.5,42.4],"Natrona, Wyoming":[3.8,9.6,15.2,22.9,48.5],"Niobrara, Wyoming":[3.1,7.8,14,23.5,51.7],"Park, Wyoming":[4,8.9,15.1,23,48.9],"Platte, Wyoming":[3.6,10.2,16,23.8,46.5],"Sheridan, Wyoming":[3.3,9.5,15.7,24.5,47],"Sublette, Wyoming":[2.9,7.1,12.9,18.8,58.3],"Sweetwater, Wyoming":[3.4,9.6,15.9,24,47.1],"Teton, Wyoming":[3.1,8,12.3,19.9,56.6],"Uinta, Wyoming":[4.9,11.2,18.3,24.6,41],"Washakie, Wyoming":[3.8,9.9,15.8,24.4,46],"Weston, Wyoming":[3.4,9.9,17.4,23.6,45.7]};
  const ctx = document.getElementById('barChart').getContext('2d');
  let chart;

  function renderChart(values) {
    if (chart) chart.destroy();

    chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Bottom 20%', 'Second 20%', 'Middle 20%', 'Fourth 20%', 'Top 20%'],
        datasets: [{
          label: 'Share (%)',
          data: values,
          backgroundColor: '#4576a7'
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => ctx.parsed.y + '%'
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            max: 100,
            title: {
              display: true,
              text: 'Income Share (%)'
            }
          },
          x: {
            title: {
              display: true,
              text: 'Quintile'
            }
          }
        }
      }
    });
  }

  document.getElementById('countySelect').addEventListener('change', function() {
    renderChart(Object.values(incomeData[this.value]));
  });

  renderChart(Object.values(incomeData['Statewide']));</script>
  </body>
</html>
</html>
