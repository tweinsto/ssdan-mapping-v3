<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>body{background-color:white;}</style>

  <meta charset="UTF-8"/>
  <title>Income Distribution – New Jersey</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
        body {
          font-family: sans-serif;
          text-align: center;
          margin: 2rem;
        }
        select {
          font-size: 1rem;
          padding: 0.4rem;
          margin-bottom: 1rem;
        }
        canvas {
          width: 100%;
          max-width: 700px;
          height: 400px;
        }
      </style>
</head>
<html>
  <body>
    <h2>Income Share by Quintile – New Jersey</h2>
    <label>Select County, State:</label>
    <select id="countySelect"><option value='Statewide'>Statewide</option>
<option value='Atlantic, New Jersey'>Atlantic, New Jersey</option>
<option value='Bergen, New Jersey'>Bergen, New Jersey</option>
<option value='Burlington, New Jersey'>Burlington, New Jersey</option>
<option value='Camden, New Jersey'>Camden, New Jersey</option>
<option value='Cape May, New Jersey'>Cape May, New Jersey</option>
<option value='Cumberland, New Jersey'>Cumberland, New Jersey</option>
<option value='Essex, New Jersey'>Essex, New Jersey</option>
<option value='Gloucester, New Jersey'>Gloucester, New Jersey</option>
<option value='Hudson, New Jersey'>Hudson, New Jersey</option>
<option value='Hunterdon, New Jersey'>Hunterdon, New Jersey</option>
<option value='Mercer, New Jersey'>Mercer, New Jersey</option>
<option value='Middlesex, New Jersey'>Middlesex, New Jersey</option>
<option value='Monmouth, New Jersey'>Monmouth, New Jersey</option>
<option value='Morris, New Jersey'>Morris, New Jersey</option>
<option value='Ocean, New Jersey'>Ocean, New Jersey</option>
<option value='Passaic, New Jersey'>Passaic, New Jersey</option>
<option value='Salem, New Jersey'>Salem, New Jersey</option>
<option value='Somerset, New Jersey'>Somerset, New Jersey</option>
<option value='Sussex, New Jersey'>Sussex, New Jersey</option>
<option value='Union, New Jersey'>Union, New Jersey</option>
<option value='Warren, New Jersey'>Warren, New Jersey</option></select>
    <canvas id="barChart" width="700" height="400"></canvas>
    <script>  const incomeData = {"Statewide":[3.3,8.9,14.9,23.1,49.8],"Atlantic, New Jersey":[3.2,8.5,14.7,22.9,50.8],"Bergen, New Jersey":[3.1,8.6,14.7,23,50.6],"Burlington, New Jersey":[3.9,9.9,15.5,23.4,47.4],"Camden, New Jersey":[2.9,8.7,15.2,23.4,49.8],"Cape May, New Jersey":[3.5,8.9,14.8,22.8,50],"Cumberland, New Jersey":[2.9,8.1,13.9,22,53.1],"Essex, New Jersey":[2,6.6,12.2,21.3,57.8],"Gloucester, New Jersey":[3.8,10,16.3,24.5,45.4],"Hudson, New Jersey":[2.4,7.8,13.9,22.9,53],"Hunterdon, New Jersey":[3.8,9.6,15.4,22.8,48.4],"Mercer, New Jersey":[2.5,7.9,14,22.6,53],"Middlesex, New Jersey":[3.5,9.7,15.9,24,47],"Monmouth, New Jersey":[3,8.6,14.7,22.9,50.7],"Morris, New Jersey":[3.5,9.2,15,23,49.4],"Ocean, New Jersey":[3.7,9.2,15.1,23.3,48.8],"Passaic, New Jersey":[2.9,8.5,15,23.9,49.7],"Salem, New Jersey":[3.4,9.3,16,24.3,47],"Somerset, New Jersey":[3.4,9.2,14.6,22.9,49.9],"Sussex, New Jersey":[4.2,10.4,16,23.3,46],"Union, New Jersey":[3.2,8.4,13.9,22.3,52.1],"Warren, New Jersey":[3.8,10.3,16.7,24,45.2]};
  const ctx = document.getElementById('barChart').getContext('2d');
  let chart;

  function renderChart(values) {
    if (chart) chart.destroy();

    chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Bottom 20%', 'Second 20%', 'Middle 20%', 'Fourth 20%', 'Top 20%'],
        datasets: [{
          label: 'Share (%)',
          data: values,
          backgroundColor: '#4576a7'
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => ctx.parsed.y + '%'
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            max: 100,
            title: {
              display: true,
              text: 'Income Share (%)'
            }
          },
          x: {
            title: {
              display: true,
              text: 'Quintile'
            }
          }
        }
      }
    });
  }

  document.getElementById('countySelect').addEventListener('change', function() {
    renderChart(Object.values(incomeData[this.value]));
  });

  renderChart(Object.values(incomeData['Statewide']));</script>
  </body>
</html>
</html>
