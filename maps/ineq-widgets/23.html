<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<style>body{background-color:white;}</style>

  <meta charset="UTF-8"/>
  <title>Income Distribution – Maine</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
        body {
          font-family: sans-serif;
          text-align: center;
          margin: 2rem;
        }
        select {
          font-size: 1rem;
          padding: 0.4rem;
          margin-bottom: 1rem;
        }
        canvas {
          width: 100%;
          max-width: 700px;
          height: 400px;
        }
      </style>
</head>
<html>
  <body>
    <h2>Income Share by Quintile – Maine</h2>
    <label>Select County, State:</label>
    <select id="countySelect"><option value='Statewide'>Statewide</option>
<option value='Androscoggin, Maine'>Androscoggin, Maine</option>
<option value='Aroostook, Maine'>Aroostook, Maine</option>
<option value='Cumberland, Maine'>Cumberland, Maine</option>
<option value='Franklin, Maine'>Franklin, Maine</option>
<option value='Hancock, Maine'>Hancock, Maine</option>
<option value='Kennebec, Maine'>Kennebec, Maine</option>
<option value='Knox, Maine'>Knox, Maine</option>
<option value='Lincoln, Maine'>Lincoln, Maine</option>
<option value='Oxford, Maine'>Oxford, Maine</option>
<option value='Penobscot, Maine'>Penobscot, Maine</option>
<option value='Piscataquis, Maine'>Piscataquis, Maine</option>
<option value='Sagadahoc, Maine'>Sagadahoc, Maine</option>
<option value='Somerset, Maine'>Somerset, Maine</option>
<option value='Waldo, Maine'>Waldo, Maine</option>
<option value='Washington, Maine'>Washington, Maine</option>
<option value='York, Maine'>York, Maine</option></select>
    <canvas id="barChart" width="700" height="400"></canvas>
    <script>  const incomeData = {"Statewide":[3.7,9.3,15.3,23.3,48.5],"Androscoggin, Maine":[4,9.7,15.7,23.9,46.6],"Aroostook, Maine":[3.4,8.7,14.9,23.4,49.6],"Cumberland, Maine":[3.5,9.1,14.8,22.5,50.1],"Franklin, Maine":[3.6,9.1,14.9,23.3,49.1],"Hancock, Maine":[3.7,9,15.3,23.1,48.8],"Kennebec, Maine":[3.8,9.5,15.3,23.8,47.5],"Knox, Maine":[3.6,9.4,15.1,22.4,49.6],"Lincoln, Maine":[3.8,9.4,14.9,22.4,49.4],"Oxford, Maine":[3.7,9,15,24,48.4],"Penobscot, Maine":[3.5,9,14.9,23.7,48.8],"Piscataquis, Maine":[3.7,9.4,15,21.8,50.2],"Sagadahoc, Maine":[3.4,9.7,16.1,23.4,47.3],"Somerset, Maine":[3.7,9.1,15.3,24,47.8],"Waldo, Maine":[3.8,9.7,15.9,23.8,46.9],"Washington, Maine":[3.2,8.5,14.9,23.2,50.3],"York, Maine":[4,10.1,16.1,23.8,45.9]};
  const ctx = document.getElementById('barChart').getContext('2d');
  let chart;

  function renderChart(values) {
    if (chart) chart.destroy();

    chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['Bottom 20%', 'Second 20%', 'Middle 20%', 'Fourth 20%', 'Top 20%'],
        datasets: [{
          label: 'Share (%)',
          data: values,
          backgroundColor: '#4576a7'
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => ctx.parsed.y + '%'
            }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            max: 100,
            title: {
              display: true,
              text: 'Income Share (%)'
            }
          },
          x: {
            title: {
              display: true,
              text: 'Quintile'
            }
          }
        }
      }
    });
  }

  document.getElementById('countySelect').addEventListener('change', function() {
    renderChart(Object.values(incomeData[this.value]));
  });

  renderChart(Object.values(incomeData['Statewide']));</script>
  </body>
</html>
</html>
